id: g-010
version: 1
status: approved
question: "How do the hoodies and sweatshirts sell across the year at O'Hara Outfitters?"
interpretation_notes: "For O'Hara Outfitters the hoodie line is the category Fashion Hoodies & Sweatshirts. The brand team calls a month good when its revenue is above the average month of the period shown."
sql: |
  SELECT DATE_TRUNC(DATE(oi.created_at), MONTH) AS month,
         SUM(oi.sale_price) AS revenue,
         AVG(SUM(oi.sale_price)) OVER () AS average_month
  FROM order_items oi
  JOIN products p ON oi.product_id = p.id
  WHERE oi.status NOT IN ('Cancelled', 'Returned')
    AND p.category = 'Fashion Hoodies & Sweatshirts'
    AND oi.created_at >= TIMESTAMP '2025-10-01'
    AND oi.created_at < TIMESTAMP '2026-10-01'
  GROUP BY month
  ORDER BY month
report: |
  The hoodie line is seasonal. Mark the months above the average month as good months, as the brand team does, and say which months
  they are and how many in a row.

  Explain the shape in terms of the season and say plainly that this is a reading of the pattern, not something the data proves.
tables: [order_items, products]
brands: ["O'Hara Outfitters"]
