id: scope-ceo-total
title: The CEO sees the total of every brand, including items that have no brand
description: >
  The CEO is the only user whose scope is all brands, and items whose product has no brand are visible only to the CEO (A23). The total of the
  whole company must be stated, and it is larger than any brand manager's.
user: ceo
tags: [scope]
turns:
  - say: >
      What was the total revenue of the whole company in 2025? Count revenue as the sale price of items that were not cancelled or returned.
    expect:
      outcome: [answered, partial]
      contains: ["all brands"]
      numbers:
        - label: company revenue 2025
          sql: |
            SELECT SUM(oi.sale_price) FROM order_items oi
            WHERE oi.status NOT IN ('Cancelled', 'Returned') AND EXTRACT(YEAR FROM oi.created_at) = 2025
