- id: row-cap-ceo
  title: A very long result is cut at 50 rows, and the answer says so
  story: F15
  user: ceo
  question: >
    List every product with its revenue in 2025. Count revenue as the sale price of items that were not cancelled or returned.
  turn_kind: simple
  reference_sql: |
    SELECT p.id AS product_id, p.name AS product, SUM(oi.sale_price) AS revenue
    FROM order_items oi JOIN products p ON p.id = oi.product_id
    WHERE oi.status NOT IN ('Cancelled', 'Returned') AND EXTRACT(YEAR FROM oi.created_at) = 2025
    GROUP BY p.id, p.name
    ORDER BY revenue DESC
  compare: {column: revenue, top_n: 3, rel_tolerance: 0.01}
  must_state: [row_cap_note]
  forbid: [pii]

- id: save-then-delete-alice
  title: Save an answer, then delete it with one confirmation
  story: US7, US8, US9
  user: alice
  turns:
    - say: >
        What was my revenue in 2025? Count revenue as the sale price of items that were not cancelled or returned.
      reference_sql: |
        SELECT SUM(oi.sale_price) AS revenue FROM order_items oi
        WHERE oi.status NOT IN ('Cancelled', 'Returned') AND EXTRACT(YEAR FROM oi.created_at) = 2025
      compare: {column: revenue, top_n: 1, rel_tolerance: 0.01}
      saved_reports: 0
    - say: Save that answer as a report.
      outcome: [action_done]
      saved_reports: 1
      max_queries: 0
    - say: Now delete the report I just saved.
      outcome: [awaiting_confirmation]
      saved_reports: 1
      max_queries: 0
    - say: "yes"
      outcome: [action_done]
      saved_reports: 0
      max_queries: 0
