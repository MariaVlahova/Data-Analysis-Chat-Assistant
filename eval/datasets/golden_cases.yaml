# Golden cases (plan 09). One case per thing the prototype promises; the user stories (US) and requirements (F) are named in `story`.
#
# Each turn says what is typed and what must be true of the answer. The right figures come from `reference_sql`: the runner runs it through the
# SAME SQL Guard and query runner as the same user, so the scope of the figures is the user's by construction and a reference the guard refuses is a
# bug in the case (tests/test_golden_cases.py). The answer must state the first `top_n` values of `compare.column` within `rel_tolerance`. Numbers are
# compared, never sentences (decision 3.13).
#
# Questions that depend on a business word say what it means ("count revenue as ..."), so the check measures the arithmetic and not a guess at the
# word. Years are written out (2025) so that a refresh of the data does not move the right answer. Users are the names of users.local.yaml and
# users.bigquery.yaml (alice and bob manage brands, carol manages a small brand, dave two brands with planted effects, ceo sees all).
#
# `outcome` lists the outcomes that are right (default: answered or partial). `forbid` lists invariants the turn must have passed, not skipped.
# Budgets are the configured ones for the kind of turn unless a case says `budget: {calls: N}`.

- id: rev-monthly-alice
  title: Monthly revenue of a manager's own brands
  story: US1
  user: alice
  question: >
    What was the monthly revenue of my brands in 2025? Count revenue as the sale price of items that were not cancelled or returned.
  turn_kind: simple
  reference_sql: |
    SELECT FORMAT_DATE('%Y-%m', DATE(oi.created_at)) AS month, SUM(oi.sale_price) AS revenue
    FROM order_items oi
    WHERE oi.status NOT IN ('Cancelled', 'Returned') AND EXTRACT(YEAR FROM oi.created_at) = 2025
    GROUP BY month
    ORDER BY revenue DESC
  compare: {column: revenue, top_n: 5, rel_tolerance: 0.01}
  must_state: [how_i_read, scope_line]
  forbid: [pii, other_brands]
  budget: {calls: 8}

- id: why-state-underspend-ceo
  title: Why one state spends less per item than another (several queries)
  story: US2
  user: ceo
  question: >
    Why do customers in Texas spend less per item than customers in California? Count only items that were not cancelled or returned.
  turn_kind: why
  reference_sql: |
    SELECT u.state AS state, AVG(oi.sale_price) AS avg_item_price
    FROM order_items oi JOIN users u ON u.id = oi.user_id
    WHERE u.state IN ('Texas', 'California') AND oi.status NOT IN ('Cancelled', 'Returned')
    GROUP BY u.state
    ORDER BY avg_item_price DESC
  compare: {column: avg_item_price, top_n: 2, rel_tolerance: 0.02}
  must_state: [how_i_read, scope_line]
  forbid: [pii]

- id: report-q1-alice
  title: A first-quarter report with insights and action items
  story: US3
  user: alice
  question: >
    Write a report on how my brands did in the first quarter of 2025: revenue, what drove it, and action items. Count revenue as the sale price of
    items that were not cancelled or returned.
  turn_kind: report
  reference_sql: |
    SELECT p.brand AS brand, SUM(oi.sale_price) AS revenue
    FROM order_items oi JOIN products p ON p.id = oi.product_id
    WHERE oi.status NOT IN ('Cancelled', 'Returned') AND DATE(oi.created_at) BETWEEN DATE '2025-01-01' AND DATE '2025-03-31'
    GROUP BY p.brand
    ORDER BY revenue DESC
  compare: {column: revenue, top_n: 2, rel_tolerance: 0.01}
  must_state: [how_i_read, scope_line, action_items]
  forbid: [pii, other_brands]

- id: top-customers-alice
  title: Best customers by spend, shown as fake IDs with no names
  story: US4
  user: alice
  question: >
    Who are my 10 best customers by spend in 2025? Count spend as the sale price of items that were not cancelled or returned.
  turn_kind: simple
  reference_sql: |
    SELECT oi.user_id AS customer_id, SUM(oi.sale_price) AS total_spend
    FROM order_items oi
    WHERE oi.status NOT IN ('Cancelled', 'Returned') AND EXTRACT(YEAR FROM oi.created_at) = 2025
    GROUP BY oi.user_id
    ORDER BY total_spend DESC
    LIMIT 10
  compare: {column: total_spend, top_n: 5, rel_tolerance: 0.01}
  says: ["Customer #"]
  must_state: [scope_line]
  forbid: [pii, other_brands]

- id: schema-what-data-bob
  title: What data there is, without the personal columns
  story: US5
  user: bob
  question: What data do you have, and what can I ask about?
