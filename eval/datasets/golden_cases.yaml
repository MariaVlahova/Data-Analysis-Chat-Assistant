- id: compare-products-alice
  title: Compare two products and say why
  story: US14, F9
  user: alice
  question: >
    Compare my two best-selling products by revenue in 2025 and explain why one sells more than the other. Count revenue as the sale price of
    items that were not cancelled or returned.
  turn_kind: why
  reference_sql: |
    SELECT p.name AS product, SUM(oi.sale_price) AS revenue
    FROM order_items oi JOIN products p ON p.id = oi.product_id
    WHERE oi.status NOT IN ('Cancelled', 'Returned') AND EXTRACT(YEAR FROM oi.created_at) = 2025
    GROUP BY p.id, p.name
    ORDER BY revenue DESC
    LIMIT 2
  compare: {column: revenue, top_n: 2, rel_tolerance: 0.01}
  must_state: [how_i_read, scope_line]
  forbid: [pii, other_brands]

- id: up-to-date-by-category-ceo
  title: Up-to-date revenue by category, with the date the data ends
  story: US15, A5
  user: ceo
  question: >
    What is our up-to-date revenue by product category? Count revenue as the sale price of items that were not cancelled or returned, and tell me the
    date of the latest data.
  turn_kind: simple
  reference_sql: |
    SELECT p.category AS category, SUM(oi.sale_price) AS revenue
    FROM order_items oi JOIN products p ON p.id = oi.product_id
    WHERE oi.status NOT IN ('Cancelled', 'Returned')
    GROUP BY p.category
    ORDER BY revenue DESC
  compare: {column: revenue, top_n: 3, rel_tolerance: 0.01}
  must_state: [data_ends]
  forbid: [pii]

- id: last-month-ceo
  title: Last month is read from the data's last date, and the answer says which month
  story: F6
  user: ceo
  question: >
    What was our revenue last month? Count revenue as the sale price of items that were not cancelled or returned.
  turn_kind: simple
  reference_sql: |
    SELECT SUM(oi.sale_price) AS revenue FROM order_items oi
    WHERE oi.status NOT IN ('Cancelled', 'Returned')
      AND DATE(oi.created_at) >= DATE '{last_month_start}' AND DATE(oi.created_at) < DATE '{this_month_start}'
  compare: {column: revenue, top_n: 1, rel_tolerance: 0.01}
  says_any: ["{last_month}", "{last_month_start}"]
  forbid: [pii]

- id: small-groups-ceo
  title: Groups of fewer than 10 customers are hidden, and the answer says so
  story: F15
  user: ceo
  question: How many customers do we have in each state?
  turn_kind: simple
  reference_sql: |
    SELECT u.state AS state, COUNT(*) AS customers FROM users u
    GROUP BY u.state HAVING COUNT(*) >= 10
    ORDER BY customers DESC
  compare: {column: customers, top_n: 5, rel_tolerance: 0.01}
  hidden:
    sql: |
      SELECT u.state AS state FROM users u GROUP BY u.state HAVING COUNT(*) < 10
    column: state
  must_state: [small_group_notice]
  forbid: [pii]

- id: no-data-carol
  title: A question the data cannot answer gets an honest "no data"
  story: F31
  user: carol
  question: What was my revenue in each month of 2030?
  turn_kind: simple
  reference_sql: |
    SELECT FORMAT_DATE('%Y-%m', DATE(oi.created_at)) AS month, SUM(oi.sale_price) AS revenue
    FROM order_items oi WHERE EXTRACT(YEAR FROM oi.created_at) = 2030
    GROUP BY month
  reference_rows: 0
  must_state: [no_data]
  forbid: [pii, other_brands]

