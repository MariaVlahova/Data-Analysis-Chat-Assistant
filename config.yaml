# Prototype settings (plan 01). Secrets do NOT go here: use .env (see .env.example).
# A mistyped key stops startup on purpose. Tags: [OPEN] needs a client answer,
# [PROPOSED] is our proposal, (impl) is an implementation choice.

app:
  language: en           # A16
  currency: USD          # A17
  timezone: UTC          # A17
  data_dir: data         # runtime files: db.sqlite3, runs.jsonl, traces/, logs/, cache/ (git-ignored)
  # user_hash_salt: ...  # default: generated once into data/user_hash_salt
  # users_file: users.yaml  # config.local.yaml names users.local.yaml
  # environment: default     # default | develop | staging | prod use Gemini; local uses a model on this machine (llm.environments). OPSFLEET_ENV overrides

bigquery:
  project_id: null                   # null: GOOGLE_CLOUD_PROJECT or default credentials
  dataset: bigquery-public-data.thelook_ecommerce
  # backend: bigquery               # "local": generated sample data in DuckDB, no Google sign-in (config.local.yaml, docs/local-testing.md)
  # local_db: data/local/thelook.duckdb
  max_bytes_billed: 536870912        # 512 MiB per query [OPEN] NFR6, Q3
  query_timeout_s: 30                # [OPEN] Q3
  sql_row_limit: 1000                # the forced LIMIT
  transient_retries: 2

guards:
  k_anonymity: 10                    # [PROPOSED] NFR13, minimum 2
  rows_to_model: 50                  # [PROPOSED] NFR14
  allow_ranked_customer_lists: true  # S7 rule still open
  max_input_chars: 2000
  require_reviewed_allowlist: true   # plan 05: the chat starts only once schema_allowlist.yaml says reviewed_against_live: true
                                     # (a person compared it with the live schema and agreed the PII split). false: start with a warning.
  denied_functions: []               # plan 05: functions to refuse IN ADDITION to the ones built into the SQL Guard
                                     # (EXTERNAL_QUERY, ML.*, AI.*, OBJ.*, SESSION_USER, ... see ALWAYS_DENIED_FUNCTIONS in src/config.py).
                                     # An entry is a function name or NAMESPACE.* for a whole namespace, for example [FARM_FINGERPRINT, "SAFE.*"].

loop:
  max_subquestions: 4                # [PROPOSED]
  sql_repairs: 2                     # [PROPOSED] NFR5
  broaden_attempts: 1                # [PROPOSED] 3.11
  max_replans: 0                     # [PROPOSED] 3.10; production default 1, ceiling 2 (Q22)
  parallel_subqueries: 1             # S12

composer:
  numeric_retry: 0                   # Q29: 0 removes an unverified number and says so; 1 allows one re-ask

budget:                              # all [OPEN] until Q3 is answered (derivation in plan 04)
  simple: {calls: 8, seconds: 60}
  why: {calls: 20, seconds: 60}
  report: {calls: 20, seconds: 90}
  bytes_per_turn: 2147483648         # 2 GiB
  daily_tokens_per_user: null        # [OPEN] NFR8, Q15: tokens (in + out) one user may spend per UTC day, chat and /eval together. null: no cap.
                                     # Checked before a turn starts. /budget shows the use; /budget clear resets today's count (audited).
  alert_fraction: 0.8                # one warning line when a turn takes the day's use past this share of the cap

llm:                                 # plan 04 owns these keys
  # environments:                    # which model service each environment uses. Defaults: gemini everywhere but local
  #   local: {provider: openai_compatible, base_url: http://localhost:1234/v1, model: qwen/qwen3-30b-a3b-2507}   # api_key_env: NAME_OF_A_VARIABLE if the server wants a key
  pro_enabled: false
  models:
    light: gemini-3.5-flash-lite
    main: gemini-3.8-flash
    pro: gemini-3.1-pro-preview
    embedding: gemini-embedding-001
  default_rpm: 10                    # raise from the Google AI Studio limits page
  rate_limits: {}                    # per model: {gemini-3.8-flash: {rpm: 15}}
  retry: {base_s: 1.0, cap_s: 20.0, attempts: 3}
  breaker: {failure_threshold: 3, cooldown_s: 30.0}
  request_timeout_s: 30.0            # one Gemini attempt; the turn's remaining time wins if it is less
  # steps:                           # per step: temperature and max_output_tokens. The defaults live in src/llm_steps.py
  #   composer: {max_output_tokens: 8192}   # (temperature 0 everywhere but the Composer's 0.3; a setting you leave out keeps its default)
  pricing_usd_per_1m: null           # plan 02 cost estimate. Fill from the Google pricing page: {gemini-3.8-flash: {in: 0.0, out: 0.0}}. null: cost_usd stays null

delete:
  large_batch_threshold: 10
  undo_days: 30                      # [PROPOSED] NFR17

retention:
  audit_days: 365                    # [PROPOSED] NFR21
  checkpoint_days: 90
  trace_days: 90                     # [NOT SPECIFIED], Q25 default

observability: {}                    # runs.jsonl, evaluations.jsonl and traces/ live inside app.data_dir. To move them, set:
  # metrics_file: data/runs.jsonl    # one PII-free row per question (replace the {} above with these keys)
  # traces_dir: data/traces          # one file per question, deleted after retention.trace_days
  # evaluations_file: data/evaluations.jsonl   # one PII-free row per turn that /eval judged, with the judge's tokens

evaluation:
  enabled: true                      # the /eval command is available in the chat. Nothing is judged until someone types /eval: a chat turn makes no judge call.
  allow_self_judge: true             # the judge may be the model that answered (the result is then marked "not independent"). false: /eval refuses in that case.

golden:
  enabled: false
  top_k: 3
  min_similarity: 0.15               # chosen on probe questions, see tests/test_golden_index.py
  # seed_dir: golden/seed            # one trio per YAML file
  # glossary_file: glossary.yaml

persona:
  enabled: true                      # the one static persona, see personas/default.yaml
  default: default
