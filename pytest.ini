[pytest]
pythonpath = .
testpaths = tests
addopts = -q -m "not live"
markers =
    live: runs against real BigQuery or a real model (needs Google credentials or a key); run with `pytest -m live`
    attack: PII, brand scope and confirmation attacks against the real graph with a scripted, compromised model (offline; plan 09)
    chaos: injected faults, and the chat never crashing (offline; plan 09)
    golden: golden cases and their reference SQL (offline checks of the dataset; the scored run is `python -m eval.run_golden`; plan 09)
    trajectory: the path through the graph and the memory between turns, on the real graph with a scripted model (offline; the scored run is `python -m eval.run_trajectory`; plan 09)
